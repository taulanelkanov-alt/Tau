    view.scale = s;
    MIN_SCALE = s * 0.8;
    view.x = (vw - worldW * s) / 2;
    view.y = (vh - worldH * s) / 2;
  }

  function applyTransform() {
    world.style.transform = 'translate(' + view.x + 'px, ' + view.y + 'px)';
    if (!pendingFrame) {
      pendingFrame = requestAnimationFrame(() => {
        updateVisible();
        pendingFrame = null;
      });
    }
  }

  function pickLevel() {
    if (!chunks.length) return 0;
    const maxIdx = chunks[0].levels.length - 1;
    const cw = worldW / COLS;
    const chunkScreenWidth = cw * view.scale;
    if (chunkScreenWidth > ORIGINAL_W * 1.5) return 0;
    if (chunkScreenWidth > ORIGINAL_W * 0.75) return Math.max(0, 1);
    if (chunkScreenWidth > ORIGINAL_W * 0.35) return Math.max(0, maxIdx - 1);
    return maxIdx;
  }

  function cleanupMemory() {
    for (const c of chunks) {
      if (c.loadedLvl !== -1 && c.loadedLvl !== currentZ) {
        c.img.src = '';
        c.img.classList.remove('loaded');
        c.loadedLvl = -1;
        c.isLoading = false;
      }
    }
  }

  async function updateVisible() {
    if (!chunks.length) return;
    const z = pickLevel();
    if (z !== currentZ) {
      currentZ = z;
      currentGeneration++; 
    }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const s = view.scale;
    
    const left = -view.x / s;
    const top = -view.y / s;
    const right = left + vw / s;
    const bottom = top + vh / s;

    const cw = worldW / COLS;
    const ch = worldH / ROWS;

    const minX = Math.max(0, Math.floor(left / cw) - 1);
    const maxX = Math.min(COLS - 1, Math.ceil(right / cw) + 1);
    const minY = Math.max(0, Math.floor(top / ch) - 1);
    const maxY = Math.min(ROWS - 1, Math.ceil(bottom / ch) + 1);

    let drawnCount = 0;

    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = y * COLS + x;
        if (i >= chunks.length) continue;
        
        const c = chunks[i];
        const wrapper = c.wrapper;
        
        const x1 = Math.floor(x * cw * s);
        const y1 = Math.floor(y * ch * s);
        const x2 = Math.ceil((x + 1) * cw * s);
        const y2 = Math.ceil((y + 1) * ch * s);
        
        wrapper.style.left = (x1 - 1) + 'px';
        wrapper.style.top = (y1 - 1) + 'px';
        wrapper.style.width = (x2 - x1 + 2) + 'px';
        wrapper.style.height = (y2 - y1 + 2) + 'px';
        wrapper.style.display = 'block';

        if (c.loadedLvl !== z && !c.isLoading) {
          c.isLoading = true;
          const targetGen = currentGeneration;
          const targetZ = z;
          
          const lvlPath = c.levels[z] || c.levels[c.levels.length - 1];
          if (lvlPath) {
            // Формируем точный путь ОТНОСИТЕЛЬНО html файла
            const url = './' + c.name + '/' + lvlPath;
            
            const tempImg = new Image();
            tempImg.onload = () => {
              if (currentGeneration === targetGen && currentZ === targetZ) {
                c.img.src = url;
                c.img.onload = () => { c.img.classList.add('loaded'); };
                c.loadedLvl = targetZ;
              }
              c.isLoading = false;
            };
            tempImg.onerror = () => { c.isLoading = false; };
            tempImg.src = url;
          } else {
            c.isLoading = false;
          }
        }
        drawnCount++;
      }
    }

    for (const c of chunks) {
      if (c.x < minX || c.x > maxX || c.y < minY || c.y > maxY) {
        if (c.wrapper.style.display !== 'none') {
          c.wrapper.style.display = 'none';
        }
      }
    }

    diag.textContent = 'Уровень: ' + z + ' | На экране: ' + drawnCount;
  }

  let dragging = false, dragStart = null;
  viewer.addEventListener('mousedown', (e) => {
    dragging = true;
    dragStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    viewer.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    view.x = dragStart.vx + (e.clientX - dragStart.x);
    view.y = dragStart.vy + (e.clientY - dragStart.y);
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    viewer.classList.remove('dragging');
  });

  viewer.addEventListener('wheel', (e) => {
    if (!chunks.length) return;
    e.preventDefault();
    const rect = viewer.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = Math.min(20, Math.max(MIN_SCALE, view.scale * factor));
    view.x = mx - (mx - view.x) * (newScale / view.scale);
    view.y = my - (my - view.y) * (newScale / view.scale);
    view.scale = newScale;
    applyTransform();
  }, { passive: false });

  window.addEventListener('resize', () => {
    if (chunks.length) updateVisible();
  });

  init();
</script>
</body>
</html>
